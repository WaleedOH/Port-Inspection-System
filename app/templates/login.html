{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
{% if needs_setup %}<p class="note bad" role="alert">Setup needed: add an <strong>ADMIN_PASSWORD</strong> environment variable (and a <strong>SECRET_KEY</strong>) in your hosting settings, then redeploy. See the README.</p>{% endif %}
{% if error %}<p class="note bad" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="card">
  <label>Username <input name="username" autocomplete="username" autocapitalize="none" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">Log in</button>
</form>
{% endblock %}
